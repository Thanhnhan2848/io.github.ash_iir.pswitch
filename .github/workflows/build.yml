name: Build PSwitch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          ln -sfn "$ANDROID_HOME" "$HOME/android-sdk"

      - name: Fetch compile-only jars
        run: |
          mkdir -p tools
          curl -fsSL -o tools/android-4.1.1.4.jar \
            https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar
          cp -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar" tools/r8.jar

      - name: Build
        run: bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSwitch-apk
          path: PSwitch.apk
