name: Build PSwitch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREFIX: /usr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          ln -sfn "$ANDROID_HOME" "$HOME/android-sdk"
          mkdir -p "$HOME/Android"
          ln -sfn "$ANDROID_HOME" "$HOME/Android/Sdk"
          sudo mkdir -p /usr/share/java
          D8_JAR=$(find "$ANDROID_HOME" -name "d8.jar" | head -n 1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME" -name "apksigner.jar" | head -n 1)
          echo "Found D8_JAR=$D8_JAR"
          echo "Found APKSIGNER_JAR=$APKSIGNER_JAR"
          [ -n "$D8_JAR" ] && sudo ln -sf "$D8_JAR" /usr/share/java/d8.jar
          [ -n "$APKSIGNER_JAR" ] && sudo ln -sf "$APKSIGNER_JAR" /usr/share/java/apksigner.jar

      - name: Fetch compile-only android.jar
        run: |
          mkdir -p tools
          curl -fsSL -o tools/android-4.1.1.4.jar \
            https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar

      - name: Build
        run: |
          cat -n build.sh
          bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSwitch-apk
          path: PSwitch.apk
